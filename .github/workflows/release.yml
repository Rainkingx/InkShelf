name: Release InkShelf

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish InkShelf
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy CI Gradle settings
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Restore InkShelf signing key
        env:
          INKSHELF_DEBUG_KEYSTORE: ${{ secrets.INKSHELF_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$INKSHELF_DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Build InkShelf
        run: ./gradlew :app:assembleDevDebug -x :app:formatKotlinMain

      - name: Prepare universal APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/dev/debug/*universal-debug.apk dist/InkShelf.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/InkShelf.apk \
            --title "InkShelf $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
