name: Release InkShelf

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish InkShelf
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy CI Gradle settings
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Restore InkShelf release key
        env:
          INKSHELF_RELEASE_KEYSTORE: ${{ secrets.INKSHELF_RELEASE_KEYSTORE }}
        run: |
          mkdir -p "$RUNNER_TEMP/inkshelf-signing"
          echo "$INKSHELF_RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/inkshelf-signing/inkshelf-release.keystore"
          chmod 600 "$RUNNER_TEMP/inkshelf-signing/inkshelf-release.keystore"

      - name: Build signed InkShelf beta
        env:
          INKSHELF_RELEASE_STORE_FILE: ${{ runner.temp }}/inkshelf-signing/inkshelf-release.keystore
          INKSHELF_RELEASE_PASSWORD: ${{ secrets.INKSHELF_RELEASE_PASSWORD }}
        run: ./gradlew :app:assembleStandardBeta -x :app:formatKotlinMain

      - name: Prepare universal APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/beta/*universal-beta.apk dist/InkShelf.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/InkShelf.apk \
            --title "InkShelf $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
