name: Build

on:
  push:
    branches:
      - main
      - inkshelf-2.0
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build dev debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Copy CI Gradle settings
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Restore InkShelf signing key
        if: github.event_name != 'pull_request'
        env:
          INKSHELF_DEBUG_KEYSTORE: ${{ secrets.INKSHELF_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$INKSHELF_DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Build InkShelf
        shell: bash
        run: |
          # Retry only the intermittent Kotlin DSL plugin download failure.
          # Real compile/test errors must fail immediately, not be hidden.
          for attempt in 1 2 3; do
            set +e
            ./gradlew :app:assembleDevDebug -x :app:formatKotlinMain 2>&1 | tee "$RUNNER_TEMP/inkshelf-build.log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Fq "Plugin [id: 'org.gradle.kotlin.kotlin-dsl'" "$RUNNER_TEMP/inkshelf-build.log"; then
              exit "$result"
            fi
            echo "::warning::Kotlin DSL plugin resolution failed; retrying ($attempt/3)"
            sleep $((attempt * 20))
          done

      - name: Test InkShelf 2.0 news and BatCave reading guides
        run: ./gradlew :app:testDevDebugUnitTest --tests 'eu.kanade.tachiyomi.ui.inkshelf.shell.InkShelf2DailyThemesTest' --tests 'eu.kanade.tachiyomi.ui.reader.viewer.pager.PanelBoundaryDetectorTest' --tests 'eu.kanade.tachiyomi.ui.inkshelf.shell.InkShelf2PulseMatcherTest' --tests 'eu.kanade.tachiyomi.ui.inkshelf.shell.InkShelf2BatCaveGuidesTest' --tests 'eu.kanade.tachiyomi.ui.inkshelf.shell.InkShelf2GuideReadingSelectionTest' --tests 'eu.kanade.tachiyomi.ui.inkshelf.shell.InkShelf2BundledEventOrdersTest' --tests 'eu.kanade.tachiyomi.ui.inkshelf.shell.InkShelf2GuideAutoMatchTest' -x :app:formatKotlinMain

      - name: Prepare InkShelf Dev APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/dev/debug/*universal-debug.apk "dist/InkShelf-Dev-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Verify Dev app identity
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump badging "dist/InkShelf-Dev-build-${GITHUB_RUN_NUMBER}.apk" > "$RUNNER_TEMP/dev-badging.txt"
          grep -F "package: name='eu.kanade.tachiyomi.debugJ2K'" "$RUNNER_TEMP/dev-badging.txt"
          grep -F "application-label:'InkShelf Dev'" "$RUNNER_TEMP/dev-badging.txt"

      - name: Upload InkShelf Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: InkShelf-Dev-build-${{ github.run_number }}
          path: dist/InkShelf-Dev-build-*.apk
          if-no-files-found: error
          retention-days: 14



